<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Admin - SENAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">
  <div id="loginSection" class="modal-card" style="margin: 40px auto;">
    <h2>Login Admin</h2>
    <input type="text" id="adminUser" class="input-field" placeholder="Usuário" style="margin-bottom:10px;">
    <input type="password" id="adminPass" class="input-field" placeholder="Senha" style="margin-bottom:10px;">
    <button onclick="login()" class="btn-submit">Entrar</button>
  </div>
</body>
</html>
