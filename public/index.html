<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvem Tecnológica de Natal - SENAI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; padding: 20px; min-height: 100vh; }
    
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    header { text-align: center; margin-bottom: 10px; }
    .badge { background: #e30613; color: #fff; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 8px; }
    h1 { font-size: 2.2rem; color: #ffffff; margin-bottom: 6px; }
    p.subtitle { color: #00f5d4; font-size: 0.95rem; }

    .main-grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

    .card { background: #161f33; border: 1px solid #233252; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .card h2 { color: #00f5d4; font-size: 1.1rem; margin-bottom: 12px; }

    .input-group { display: flex; flex-direction: column; gap: 10px; }
    input[type="text"] { background: #0b0f19; border: 1px solid #334155; padding: 12px; border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus { border-color: #00f5d4; }
    button { background: #0056a3; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
    button:hover { background: #0070d2; }

    .qr-section { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .qr-section img { background: #ffffff; padding: 8px; border-radius: 12px; margin-top: 10px; width: 140px; height: 140px; border: 2px solid #00f5d4; }

    /* Estilo e Animação da Árvore de Natal */
    .tree-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 440px; position: relative; }
    .star { font-size: 2.4rem; color: #ffd700; text-shadow: 0 0 20px #ffd700; margin-bottom: 12px; animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.25);} }

    .tree-shape { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
    .tree-row { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px 16px; }

    .word-tag { display: inline-block; font-weight: bold; text-transform: uppercase; animation: float 3s infinite ease-in-out; transition: transform 0.2s; cursor: default; }
    .word-tag:hover { transform: scale(1.3) !important; z-index: 10; }
    @keyframes float { 0%,100%{transform:translateY(0px);} 50%{transform:translateY(-7px);} }

    .trunk { width: 44px; height: 32px; background: linear-gradient(180deg, #8b4513, #4a250a); border-radius: 4px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">SENAI 2026</span>
      <h1>Nuvem Tecnológica de Natal</h1>
      <p class="subtitle">⏳ As palavras expiram e renovam-se a cada 6 horas</p>
    </header>

    <div class="main-grid">
      <!-- Painel Lateral -->
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <div class="card">
          <h2>✨ Enviar Palavra</h2>
          <form id="wordForm" class="input-group">
            <input type="text" id="wordInput" placeholder="Ex: Paz, Inovação..." maxlength="20" required autocomplete="off">
            <button type="submit">Publicar</button>
          </form>
        </div>

        <div class="card qr-section">
          <h2>📱 Acesso Telemóvel</h2>
          <p style="font-size: 0.85rem; color: #94a3b8;">Aponte a câmara para enviar:</p>
          <img id="qrCodeImg" src="" alt="QR Code Natal SENAI">
        </div>
      </div>

      <!-- Árvore de Natal -->
      <div class="card tree-container">
        <div class="star">★</div>
        <div id="treeCloud" class="tree-shape"></div>
        <div class="trunk"></div>
      </div>
    </div>
  </div>

  <script>
    // QR Code nativo via API de Imagem (100% confiável)
    const currentUrl = window.location.href;
    document.getElementById('qrCodeImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(currentUrl);

    const colors = ['#ffd700', '#ff2e63', '#00f5d4', '#ffffff', '#ff75c3', '#ffb6c1'];

    // Lista inicial de fallback para a árvore nunca ficar vazia
    const defaultWords = [
      { word: "NATAL", frequency: 5 },
      { word: "SENAI", frequency: 5 },
      { word: "INOVAÇÃO", frequency: 4 },
      { word: "UNIÃO", frequency: 4 },
      { word: "TECNOLOGIA", frequency: 3 },
      { word: "PAZ", frequency: 3 },
      { word: "ESPERANÇA", frequency: 3 },
      { word: "ALEGRIA", frequency: 2 },
      { word: "AMOR", frequency: 2 },
      { word: "FUTURO", frequency: 2 },
      { word: "SAÚDE", frequency: 1 },
      { word: "FESTA", frequency: 1 }
    ];

    function renderTree(words) {
      const container = document.getElementById('treeCloud');
      container.innerHTML = '';

      const rows = [
        document.createElement('div'),
        document.createElement('div'),
        document.createElement('div'),
        document.createElement('div'),
        document.createElement('div')
      ];

      rows.forEach(r => { r.className = 'tree-row'; container.appendChild(r); });

      words.forEach((item, index) => {
        const span = document.createElement('span');
        span.className = 'word-tag';
        span.innerText = item.word;
        
        const fontSize = Math.min(Math.max((item.frequency || 1) * 5 + 14, 14), 32);
        span.style.fontSize = fontSize + 'px';

        const color = colors[index % colors.length];
        span.style.color = color;
        span.style.textShadow = '0 0 10px ' + color;
        span.style.animationDuration = (2.5 + (index % 3) * 0.5) + 's';

        let rowIndex = 0;
        if (index > 0 && index <= 2) rowIndex = 1;
        else if (index > 2 && index <= 5) rowIndex = 2;
        else if (index > 5 && index <= 8) rowIndex = 3;
        else if (index > 8) rowIndex = 4;

        rows[rowIndex].appendChild(span);
      });
    }

    async function loadWords() {
      try {
        const res = await fetch('/api/words');
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            renderTree(data);
            return;
          }
        }
      } catch(e) {}
      renderTree(defaultWords);
    }

    document.getElementById('wordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('wordInput');
      const val = input.value.trim();
      if (val) {
        try {
          await fetch('/api/words', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ word: val })
          });
        } catch(e) {}
        input.value = '';
        loadWords();
      }
    });

    loadWords();
  </script>
</body>
</html>
