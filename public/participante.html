<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envie sua Palavra - SENAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="mobile-body">
  <div class="modal-card">
    <h2>✨ Natal SENAI ✨</h2>
    <p>Compartilhe uma palavra ou sentimento!</p>
    <form id="wordForm">
      <input type="text" id="wordInput" class="input-field" placeholder="Ex: Paz, Esperança" maxlength="25" required>
      <button type="submit" id="submitBtn" class="btn-submit" style="margin-top:15px;">Enviar Palavra</button>
    </form>
    <div id="feedback" class="feedback-msg"></div>
  </div>
  <script src="js/participante.js"></script>
</body>
</html>
